# CI caller: the org-standard polyglot workflow for the ts/ and go/
# trees. rust.yml runs the Rust gate (ci/rust/run.sh) separately.
name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  # deps is empty: the ts/ and go/ trees build against released packages
  # alone (npm's registry and go/go.mod's requirements), and the tests read
  # the test files vendored in test/fixtures, so nothing is cloned.
  # alchemy's downstream workflow runs this repository's gates against
  # sibling checkouts instead (DMOG_SIBLINGS=1).
  ci:
    uses: tabnas/.github/.github/workflows/polyglot-ci.yml@main
    with:
      deps: ""

  # The shared workflow runs `go test ./...` with no build tags. transduce
  # builds its rule-event adapter only under the `tabnas_nodecell` tag,
  # which earlier releases told Go users to install the command with.
  # Neither `dmog run` nor `translate` reads through the adapter now,
  # and this job runs the suite once more with the tag, to hold that such
  # a build reads every document as one without it.
  go-nodecell:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: dmog

      # cache: false, as in support's job: setup-go looks for go.mod in
      # $GITHUB_WORKSPACE, non-recursively, and the checkout is one level
      # down, so the cache step would warn on every run.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.24"
          cache: false

      - name: Build with the tag
        working-directory: dmog/go
        run: go build -tags tabnas_nodecell ./...

      - name: Vet and test with the tag
        working-directory: dmog/go
        run: |
          go vet -tags tabnas_nodecell ./...
          go test -tags tabnas_nodecell -v ./...
