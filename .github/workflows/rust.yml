# The gates: ci/polyglot/run.sh (TypeScript and Go) and ci/rust/run.sh
# (Rust), standalone: every dependency from its registry, and the test
# files vendored in test/fixtures. (alchemy's downstream workflow runs the
# same gates against sibling checkouts, with DMOG_SIBLINGS=1.)
#
# Runs on every branch push and on pull requests. `branches` is set
# explicitly so a tag push does not run the gate on a ref where the path
# filters mean nothing.
name: Rust

on:
  push:
    branches: [ '**' ]
    paths:
      - 'rs/**'
      - 'go/**'
      - 'ts/**'
      - 'ci/**'
      - 'test/**'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - 'rs/**'
      - 'go/**'
      - 'ts/**'
      - 'ci/**'
      - 'test/**'
      - '.github/workflows/rust.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: dmog

      - name: Install the MSRV toolchain
        run: |
          MSRV=$(awk -F'"' '/^rust-version = /{print $2; exit}' dmog/rs/Cargo.toml)
          rustup toolchain install "$MSRV" --profile minimal --component rustfmt,clippy
          rustup default "$MSRV"

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24.x

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: 1.24.x

      - name: Gate TypeScript and Go
        run: dmog/ci/polyglot/run.sh

      - name: Gate Rust
        run: dmog/ci/rust/run.sh
