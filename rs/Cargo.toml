[package]
name = "tabnas-dmog"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
authors = ["Richard Rodger <http://richardrodger.com>"]
description = "The dmog command (data mogrify): translates a document from any tabnas format into any other, streaming, and runs alchemy programs over JSON documents, composing tabnas-alchemy, tabnas-transduce and tabnas-render."
license = "MIT"
homepage = "https://tabnas.dev"
repository = "https://github.com/tabnas/dmog"
readme = "README.md"
include = ["src/**", "README.md", "LICENSE"]
keywords = ["dsl", "streaming", "transducer", "cli", "tabnas"]
categories = ["command-line-utilities", "parsing"]

# `dmog canon | format | check | explain | run | translate | formats`,
# the one place the language, the routers and the renderers meet. The
# command was `alchemy` (crate tabnas-alchemy-cli) until 2026-10-25.
[[bin]]
name = "dmog"
path = "src/bin/dmog.rs"

[dependencies]
# From crates.io, each at its latest release, the version go/go.mod
# requires and npm installs (go/cmd/dmog/fixtures_test.go holds the three
# together): the language and its shared types, the routers (and the parser source `run` and
# `translate` read their input through), the renderers, and the grammars
# `translate` reads and writes, each with its translation parts (`run`
# parses its input with the JSON one).
tabnas-alchemy = { version = "0.4.1" }
tabnas-transduce = { version = "0.6.9" }
tabnas-render = { version = "0.2.7" }
tabnas-json = { version = "0.5.20" }
tabnas-abnf = { version = "0.5.1" }
tabnas-c = { version = "0.6.2" }
tabnas-chess = { version = "0.2.0" }
tabnas-css = { version = "0.5.20" }
tabnas-csv = { version = "0.6.11" }
tabnas-ebnf = { version = "0.2.2" }
tabnas-expr = { version = "0.6.4" }
tabnas-feed = { version = "0.6.21" }
tabnas-gbnf = { version = "0.2.1" }
tabnas-ini = { version = "0.5.24" }
tabnas-json5 = { version = "0.5.20" }
tabnas-jsonc = { version = "0.5.18" }
tabnas-jsonic = { version = "0.7.12" }
tabnas-jsonl = { version = "0.1.20" }
tabnas-markdown = { version = "0.7.15" }
tabnas-proto = { version = "0.7.1" }
tabnas-semver = { version = "0.0.11" }
tabnas-toml = { version = "0.5.23" }
tabnas-xml = { version = "0.7.20" }
tabnas-yaml = { version = "0.5.34" }
tabnas-zon = { version = "0.5.20" }

[dev-dependencies]
# The failures the binary prints on standard error, read back as JSON.
serde_json = { version = "1.0", features = ["preserve_order"] }
# The tests moved here from tabnas-alchemy, which lower and run programs
# on transduce's routers and render's renderers, reading alchemy's shared
# fixtures from test/fixtures. From crates.io, like the rest: the engine
# (its `Tabnas` and its error catalogue) and the shared fixture loader and
# runner; the grammars the tests read documents with are the command's own
# dependencies. ci/rust/run.sh can patch every tabnas crate to a sibling
# checkout instead (DMOG_SIBLINGS=1), for testing unreleased changes.
tabnas = { package = "tabnas-parser", version = "0.12.21" }
tabnas-support = { version = "0.3.9", features = ["serde_json"] }
